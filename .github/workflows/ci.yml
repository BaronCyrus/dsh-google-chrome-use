name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The plugin promises macOS and Windows. Hosted runners on both ship Google Chrome.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Installing DSH globally has taken up to 20 minutes on Windows.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test
      - name: Real Chrome through the plugin's server command
        run: pnpm run smoke
      - name: Install the DSH this plugin targets
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.5
      - name: The whole plugin inside DSH, with a scripted model
        run: node scripts/e2e-dsh.mjs

  windows-headed:
    name: Chrome with a window (windows-latest)
    # The plugin opens a window by default. Runners have a desktop, so the window
    # really opens, and the artifact shows what was on the screen.
    runs-on: windows-latest
    # Installing DSH globally has taken up to 20 minutes on Windows.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windowed Chrome through the plugin's server command
        run: node scripts/smoke.mjs --headed --out smoke-output
      - name: Install the DSH this plugin targets
        run: npm install --global @deepseek-ai/dsh@0.2.1-rc.5
      - name: The plugin on its default windowed mode inside DSH
        run: node scripts/e2e-dsh.mjs --headed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-headed
          path: smoke-output
